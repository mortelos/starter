name: PHPStan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config --global github-oauth.github.com "$MORTELOS_GITHUB_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist
        env:
          MORTELOS_GITHUB_TOKEN: ${{ secrets.MORTELOS_GITHUB_TOKEN }}

      - name: Run PHPStan (level max)
        run: composer analyse
