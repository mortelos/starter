name: PHPStan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    # ci-runner: choose by who uses the system; UTEQ itself uses [self-hosted, uteq-dev].
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSER_AUTH: '{"http-basic":{"packages.mortelos.com":{"username":"uteq","password":"${{ secrets.MORTELOS_REGISTRY_TOKEN }}"}}}'
      APP_LOCALE: nl
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        if: runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan (level max)
        run: composer analyse
