name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Label changes must not cancel the run authorized by the tenant-isolation exception label.
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  tests:
    # ci-runner: choose by who uses the system; UTEQ itself uses [self-hosted, uteq-dev].
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSER_AUTH: '{"http-basic":{"packages.mortelos.com":{"username":"uteq","password":"${{ secrets.MORTELOS_REGISTRY_TOKEN }}"}}}'
      APP_LOCALE: nl
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        if: runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: lts/*

      - name: Start PostgreSQL on GitHub-hosted
        if: runner.environment == 'github-hosted'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb testing

      - name: Prepare self-hosted database and browser environment
        if: runner.environment == 'self-hosted'
        env:
          TEST_DATABASE: mortelos_ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          echo "DB_HOST=/srv/ci-pg" >> "$GITHUB_ENV"
          echo "DB_PORT=5433" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$(id -un)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=" >> "$GITHUB_ENV"
          echo "DB_DATABASE=$TEST_DATABASE" >> "$GITHUB_ENV"
          echo "TENANCY_DATABASE_PREFIX=${TEST_DATABASE}_tenant_" >> "$GITHUB_ENV"
          # Playwright versions without Ubuntu 26.04 support use the runner's cached libraries.
          echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64" >> "$GITHUB_ENV"
          libs="$HOME/.local/chromium-libs/root/usr/lib/x86_64-linux-gnu"
          if [ -d "$libs" ]; then
            echo "LD_LIBRARY_PATH=$libs:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
          PGPASSWORD= createdb -h /srv/ci-pg -p 5433 "$TEST_DATABASE"

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          npm run build

      - name: Install Chromium on GitHub-hosted
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium on self-hosted
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      - name: Check tenant isolation
        shell: bash
        env:
          # Escape hatch for a legitimate new exception: the label is applied only by the orchestrator after review.
          # It counts only in the run that the labeling itself starts, i.e. for the commit that was reviewed: a later
          # push (synchronize) is checked with --base again until the label is removed and applied again.
          # The guard still runs and every baseline entry still needs a reason and an issue.
          EXCEPTION_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name == 'tenant-isolation-exception' }}
        run: |
          git rev-parse --verify origin/main
          # Bootstrap only while main has no baseline; subsequent PRs must shrink it.
          baseline=$(git ls-tree --name-only origin/main -- .mortelos/tenant-isolation.php)
          if [[ "$EXCEPTION_LABEL" == "true" ]]; then
            echo "::notice::Label tenant-isolation-exception: the guard runs without --base, so the baseline may grow in this PR."
            composer test:tenant-isolation
          elif [[ -n "$baseline" ]]; then
            composer test:tenant-isolation -- --base=origin/main
          else
            composer test:tenant-isolation
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Agent rules are up to date
        run: php artisan mortelos:agent-rules:check

      - name: Unit and Feature
        # Includes the architecture, UI, outlets and code-language guards.
        run: composer test

      - name: Browser verify
        run: composer test:browser

      - name: Upload verify screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

      - name: Drop self-hosted test databases
        if: always() && runner.environment == 'self-hosted'
        env:
          TEST_DATABASE: mortelos_ci_${{ github.run_id }}_${{ github.run_attempt }}
          PGPASSWORD: ''
        run: |
          psql -h /srv/ci-pg -p 5433 -d postgres -Atc \
            "select datname from pg_database where datname = '$TEST_DATABASE' or starts_with(datname, '${TEST_DATABASE}_')" |
            while read -r db; do dropdb -h /srv/ci-pg -p 5433 --if-exists --force "$db"; done
