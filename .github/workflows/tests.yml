name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        # Zelfde registry-token als phpstan.yml.
        run: |
          composer config --global http-basic.packages.mortelos.com uteq "$MORTELOS_REGISTRY_TOKEN"
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          npm run build
          npx playwright install --with-deps chromium
        env:
          MORTELOS_REGISTRY_TOKEN: ${{ secrets.MORTELOS_REGISTRY_TOKEN }}

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Unit and Feature
        run: composer test

      - name: Browser verify
        run: composer test:browser

      - name: Upload verify screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
